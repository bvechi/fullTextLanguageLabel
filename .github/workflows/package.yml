name: Build OJS plugin package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          php -l index.php
          php -l FullTextLanguageLabelPlugin.inc.php

      - name: Validate JavaScript syntax
        run: node --check js/fullTextLanguageLabel.js

      - name: Read plugin version
        run: |
          release=$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' version.xml)

          if [ -z "$release" ]; then
            echo "::error file=version.xml::<release> not found"
            exit 1
          fi

          echo "PACKAGE_NAME=fullTextLanguageLabel-${release}-ojs3.3" >> "$GITHUB_ENV"

      - name: Build plugin directory
        run: |
          mkdir -p build/fullTextLanguageLabel
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            ./ build/fullTextLanguageLabel/

      - name: Create OJS package
        run: |
          tar -czf "${PACKAGE_NAME}.tar.gz" \
            -C build \
            fullTextLanguageLabel

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.tar.gz
          if-no-files-found: error
